version: '3.9'
services:
  ndyt:
    container_name: ndyt
    image: 'registry.richardxiong.com/ndyt:latest'
    restart: unless-stopped
    ports:
      - '3005'
    labels:
      - traefik.enable=true
      - traefik.http.routers.ndyt.rule=Host(`ndyt.richardxiong.com`)
    environment:
      - DEEPL_KEY=$DEEPL_KEY
      - ADMIN_KEY=$ADMIN_KEY

networks:
  default:
    name: proxy
    external: true
