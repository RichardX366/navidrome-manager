version: '3.9'
services:
  ndyt:
    container_name: ndyt
    image: 'registry.richardxiong.com/ndyt:latest'
    restart: unless-stopped
    ports:
      - '3005'
    labels:
      - traefik.enable=true
      - traefik.http.routers.ndyt.rule=Host(`ndyt.richardxiong.com`)
    environment:
      - DATABASE_URL=$DATABASE_URL
      - JWT_SECRET=$JWT_SECRET

networks:
  default:
    name: proxy
    external: true
